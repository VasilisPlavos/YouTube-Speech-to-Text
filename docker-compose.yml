# YouTube-Speech-to-Text + local watch-folder
#
#   docker compose up -d --build     # build the image and start the service
#   docker compose logs -f           # follow logs ("Application startup complete")
#   docker compose down              # stop and remove the container
#
# Drop audio/video files into  <media>/in
#   -> transcripts (+ the original) appear in  <media>/out
#   -> failures land in           <media>/error
# The YouTube endpoint stays available at http://localhost:3300/yt/<id>
services:
  youtube-to-text:
    build: .
    image: youtube-to-text:latest
    container_name: youtube-to-text
    ports:
      - "3300:80"
    volumes:
      # Host watch folder -> /data in the container.
      # The watcher auto-creates in/ out/ error/ .work/ on startup.
      # Change the host path here, or override it by setting MEDIA_DIR in the environment.
      - "${MEDIA_DIR:-${USERPROFILE}/docker/volumes/whisper_data/media}:/data"
    environment:
      WATCH_DIR: /data
      POLL_INTERVAL: "5"    # seconds between scans of in/
      DEFAULT_LANG: ""      # empty = Whisper auto-detect; e.g. "en" or "el"
    restart: unless-stopped
